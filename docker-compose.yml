# Local development databases. Host ports 5440/5441 avoid clashing with a
# locally installed PostgreSQL on 5432.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ggi
      POSTGRES_PASSWORD: ggi_dev_password
      POSTGRES_DB: ggi
    ports:
      - '127.0.0.1:5440:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ggi -d ggi']
      interval: 5s
      timeout: 3s
      retries: 10

  db-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ggi
      POSTGRES_PASSWORD: ggi_test_password
      POSTGRES_DB: ggi_test
    ports:
      - '127.0.0.1:5441:5432'
    # Ephemeral storage: the test database is disposable and faster on tmpfs.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ggi -d ggi_test']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
