name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ggi
          POSTGRES_PASSWORD: ggi_test_password
          POSTGRES_DB: ggi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ggi -d ggi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # CI-only throwaway database; not a secret.
      TEST_DATABASE_URL: postgresql://ggi:ggi_test_password@localhost:5432/ggi_test?schema=public
      DATABASE_URL: postgresql://ggi:ggi_test_password@localhost:5432/ggi_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
